<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>V11 LuckyJet</title>
<style>
 body{background:#07070a;color:white;text-align:center;font-family:sans-serif;padding:15px}
 #in{width:92%;padding:22px;font-size:18px;border-radius:12px;border:2px solid #7a5CFA;background:#111;color:white;text-align:center}
 #res{font-size:80px;font-weight:900;margin:20px 0;color:#7a5CFA}
 #info{color:#aaa;font-size:14px}
 .box{background:#111;padding:10px;border-radius:10px;margin-top:20px;text-align:left}
</style>
</head>
<body>
<h2 style="color:#7a5CFA">V11 - LUCKYJET VERIF</h2>
<input id="in" placeholder="Colle le HASH FINAL ici (après le tour)">
<div id="res">--</div>
<div id="info">En attente...</div>
<div class="box">
<b>Mode:</b><br>
Aviator = utilise 13 lettres du HASH<br>
LuckyJet = utilise 8 lettres du HASH<br><br>
Ton HASH <b>ecd8d60d...</b> = 8 lettres <b>ecd8d60d</b> = 396...<br>
Formule LuckyJet: 4294967296 / valeur * 0.99
</div>
<script>
const inp=document.getElementById('in');
const res=document.getElementById('res');
const info=document.getElementById('info');
inp.oninput=()=>{
 let h=inp.value.trim().toLowerCase().replace(/[^a-f0-9]/g,'');
 if(h.length<8){res.innerText='--'; return;}
 let first8=h.slice(0,8);
 let val=parseInt(first8,16);
 let crash= (4294967296 / (val+1)) * 0.99;
 if(val===0) crash=1;
 crash=Math.floor(crash*100)/100;
 if(crash<1) crash=1;
 res.innerText=crash.toFixed(2)+'x';
 info.innerText='8 lettres = '+first8+' | val = '+val;
 if(crash<1.2) res.style.color='#ff3b3b';
 else if(crash<2) res.style.color='#ffaa00';
 else res.style.color='#7a5CFA';
}
</script>
</body>
</html>
