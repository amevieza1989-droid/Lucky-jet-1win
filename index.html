<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>V11 - DECODEUR POUR MON JEU</title>
<style>
body{background:#07070a;color:white;text-align:center;font-family:sans-serif;padding:12px;margin:0}
h2{color:#00ff88;font-size:18px;letter-spacing:1px}
#in{width:92%;padding:20px;font-size:18px;border-radius:14px;border:2px solid #00ff88;background:#0f0f0f;color:#fff;text-align:center;outline:none}
#res{font-size:80px;font-weight:900;margin:15px 0 5px 0;color:#00ff88;line-height:1}
#ok{color:#888;font-size:14px;margin-bottom:15px}
#clear{background:#2a2a2a;color:#fff;border:none;padding:10px 22px;border-radius:10px;font-size:14px}
#hist{background:#111;border-radius:12px;padding:12px;margin-top:20px;text-align:left}
#hist b{font-size:14px}
.item{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #222;font-size:14px}
</style>
</head>
<body>
<h2>V11 - DECODEUR POUR MON JEU</h2>
<input id="in" placeholder="Colle le HASH ici">
<div id="res">--</div>
<div id="ok">En attente...</div>
<button id="clear" onclick="effacer()">EFFACER</button>
<div id="hist">
<b>Historique:</b>
<div id="list"></div>
</div>
<script>
const E=4503599627370496;
const inp=document.getElementById('in');
const res=document.getElementById('res');
const ok=document.getElementById('ok');
const list=document.getElementById('list');

function effacer(){
 inp.value='';
 res.innerText='--';
 ok.innerText='En attente...';
}

inp.oninput=()=>{
 let h=inp.value.trim().toLowerCase().replace(/[^a-f0-9]/g,'');
 if(h.length<13){res.innerText='--'; ok.innerText='Colle 13 lettres...'; return;}
 let r=parseInt(h.slice(0,13),16);
 let crash;
 if(r%33==0) crash=1;
 else crash=E/(E-r);
 crash=Math.floor(crash*100)/100;
 if(crash<1) crash=1;
 if(crash>1000) crash=1000;
 res.innerText=crash.toFixed(2)+'x';
 ok.innerText='OK - '+h.slice(0,9)+'...';
 
 // Ajoute à l'historique
 if(h.length>=32){
   let div=document.createElement('div');
   div.className='item';
   div.innerHTML='<span>'+h.slice(0,10)+'..</span><b>'+crash.toFixed(2)+'x</b>';
   list.prepend(div);
 }
 if(crash<1.2) res.style.color='#ff3b3b';
 else if(crash<2) res.style.color='#ffaa00';
 else res.style.color='#00ff88';
}
</script>
</body>
</html>
