<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>V11 - Outil Propriétaire</title>
<style>
  body { background:#07070a; color:white; font-family: sans-serif; margin:0; padding:15px; text-align:center; }
  h2 { color:#00ff88; margin:10px; font-size:18px; }
  #hashInput { width:92%; padding:22px; font-size:20px; border-radius:12px; border:2px solid #00ff88; background:#111; color:white; text-align:center; outline:none; }
  #result { font-size:85px; font-weight:900; margin:15px 0 5px 0; color:#00ff88; line-height:1; }
  #status { font-size:16px; color:#aaa; height:20px; }
  #hist { margin-top:20px; text-align:left; background:#111; border-radius:10px; padding:10px; max-height:200px; overflow:auto; }
  .line { padding:8px; border-bottom:1px solid #222; display:flex; justify-content:space-between; }
  button { background:#222; color:white; border:1px solid #333; padding:12px 18px; border-radius:8px; margin-top:10px; }
</style>
</head>
<body>

<h2>V11 - DECODEUR POUR MON JEU</h2>
<input id="hashInput" type="text" placeholder="COLLE LE HASH ICI" autocomplete="off" autofocus>

<div id="result">--</div>
<div id="status">En attente...</div>

<button onclick="document.getElementById('hashInput').value=''; document.getElementById('result').innerText='--';">EFFACER</button>

<div id="hist"><b>Historique:</b><div id="histList"></div></div>

<script>
const e = 4503599627370496; // 2^52
const input = document.getElementById('hashInput');
const resDiv = document.getElementById('result');
const statusDiv = document.getElementById('status');
const histList = document.getElementById('histList');

function decode(hashFull) {
  try {
    let clean = hashFull.trim().toLowerCase().replace(/[^a-f0-9]/g,'');
    if (clean.length < 13) return null;
    let first13 = clean.slice(0,13);
    let r = parseInt(first13, 16);
    let crash;
    if (r % 33 === 0) crash = 1.00;
    else crash = e / (e - r);
    crash = Math.floor(crash * 100) / 100;
    if (crash > 1000) crash = 1000;
    if (crash < 1) crash = 1;
    return { crash: crash, hash: clean };
  } catch(e) { return null; }
}

input.addEventListener('input', () => {
  let val = input.value;
  if (val.length < 10) { resDiv.innerText='--'; statusDiv.innerText='Colle...'; return; }
  let decoded = decode(val);
  if (!decoded) { statusDiv.innerText='HASH incomplet...'; return; }
  
  resDiv.innerText = decoded.crash.toFixed(2) + 'x';
  statusDiv.innerText = 'OK - ' + decoded.hash.slice(0,10) + '...';
  
  // Couleur selon valeur
  if(decoded.crash < 1.20) resDiv.style.color = '#ff3b3b';
  else if(decoded.crash < 2) resDiv.style.color = '#ffaa00';
  else resDiv.style.color = '#00ff88';

  // Ajoute à l'historique si nouveau
  if (histList.innerHTML.indexOf(decoded.hash.slice(0,15)) === -1) {
    let div = document.createElement('div');
    div.className='line';
    div.innerHTML = '<span>'+decoded.hash.slice(0,10)+'..</span><b>'+decoded.crash.toFixed(2)+'x</b>';
    histList.prepend(div);
  }
});

// Test auto avec tes exemples
console.log('V11 pret. Teste avec 252dd280fd5781bb8b74d161cb2b66638ef07ba9de6b048dbea98df68b3d1668 => 1.16x');
</script>
</body>
</html>
