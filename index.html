<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>V7 FINAL - FAIT A LOME</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}body{background:#070a1e;color:#fff;min-height:100vh}
.top{background:linear-gradient(90deg,#00d26a,#00ff88);color:#000;text-align:center;padding:12px;font-weight:900;font-size:10px}
.box{background:linear-gradient(180deg,#1a234d,#131a3a);border:2px solid #00d26a60;border-radius:20px;margin:12px;padding:18px;text-align:center}
.pred{font-size:64px;font-weight:900;color:#00ff88;margin:4px 0}
.badge{padding:8px 14px;border-radius:20px;font-size:11px;font-weight:800;display:inline-block;margin-bottom:10px;background:#00d26a22;color:#00ff88;border:1px solid #00d26a}
.btn{width:100%;background:linear-gradient(90deg,#00d26a,#00ff88);border:none;padding:16px;border-radius:14px;font-weight:900;font-size:13px;color:#000;cursor:pointer;margin-top:8px}
.expli{background:#0e1430;border-radius:10px;padding:10px;margin-top:8px;font-size:11px;color:#aab2d0;text-align:left;line-height:1.4}
.bar{background:#00d26a15;border:1px dashed #00d26a60;border-radius:10px;padding:10px;margin-top:10px;font-size:10px;color:#00ff88;text-align:left}
.h-title{color:#00ff88;font-weight:900;font-size:11px;margin:18px 12px 8px}
.histo{display:flex;gap:8px;flex-wrap:wrap;padding:0 12px}
.chip{padding:9px 14px;border-radius:20px;font-weight:900;font-size:13px}.chip.red{background:#ff2d55;color:#fff}.chip.green{background:#00d26a;color:#000}.chip.gold{background:#ffb300;color:#000}
.input-box{background:#131a3a;border:1px solid #00d26a20;border-radius:16px;margin:14px;padding:14px}
.input-line{display:flex;gap:10px;margin-top:10px}input{flex:1;background:#0e1430;border:1px solid #00d26a40;border-radius:12px;padding:14px;color:#fff;text-align:center;font-weight:800;font-size:16px}
.btn-add{background:linear-gradient(90deg,#00d26a,#00ff88);border:none;border-radius:12px;padding:0 24px;font-weight:900;color:#000;font-size:20px}
.btns{display:flex;gap:8px;margin-top:10px}.btn-mini{flex:1;background:#1c244a;border:1px solid #ffffff10;border-radius:10px;padding:10px;color:#8b92b5;font-weight:700;font-size:10px}
</style>
</head>
<body>
<div class="top">🛡️ V7 FINAL - ANTI-OUTLIER + REGLE BOSS 1.75→1.00 / 2.5→1.50</div>
<div class="box">
<div style="color:#8b92b5;font-size:12px">V7 Final - Analyse + Table SAFE</div>
<div class="pred" id="prediction">--</div>
<div class="badge" id="badge">En attente</div>
<div class="expli" id="expli">Règle: <1.75 attendu → 1.00x safe. 2.5 attendu → 1.50x safe. Outliers >10x ignorés.</div>
<div class="bar" id="bar">--</div>
<button class="btn" onclick="generer()">🛡️ ANALYSER V7 FINAL</button>
</div>
<div class="h-title">HISTORIQUE</div>
<div class="histo" id="histo"></div>
<div class="input-box">
<div class="input-line"><input id="inputCrash" type="number" step="0.01" placeholder="Ex: 1.85" inputmode="decimal"><button class="btn-add" onclick="ajouter()">+</button></div>
<div class="btns"><button class="btn-mini" onclick="effacer()">EFFACER</button><button class="btn-mini" onclick="exemple()">TEST 5 PETITS → 8.12</button></div>
</div>
<script>
let historique=[];
function renderHisto(){
 let el=document.getElementById('histo'); el.innerHTML='';
 historique.forEach(v=>{
  let d=document.createElement('div');
  if(v>=10) d.className='chip gold'; else d.className='chip '+(v<1.35?'red':'green');
  d.textContent=v.toFixed(2)+'x'; el.appendChild(d);
 });
}
function ajouter(){
 let val=parseFloat(document.getElementById('inputCrash').value.replace(',','.'));
 if(isNaN(val)||val<1) return;
 historique.push(val); if(historique.length>15) historique.shift();
 document.getElementById('inputCrash').value=''; renderHisto(); generer();
}
function effacer(){ historique=[]; renderHisto(); document.getElementById('prediction').textContent='--'; }
function exemple(){ historique=[1.12,1.25,1.06,1.31,1.18]; renderHisto(); generer(); }

function generer(){
 if(historique.length<2){ alert('2 minimum'); return; }

 // FILTRE ANTI-OUTLIER >10x pour moyenne et analyse
 let sansOutlier=historique.filter(x=>x<10);
 if(sansOutlier.length===0) sansOutlier=[historique[historique.length-1]<10?historique[historique.length-1]:1.5];
 let avg=sansOutlier.reduce((a,b)=>a+b,0)/sansOutlier.length;

 // Dernier VALIDE (<10x) pour analyse
 let lastValide=[...historique].reverse().find(x=>x<10)||last;
 let last=lastValide;
 let last2=[...historique].slice(0,-1).reverse().find(x=>x<10)||last;
 let last3=[...historique].slice(0,-2).reverse().find(x=>x<10)||last2;

 let consecutifPetits=0;
 for(let i=sansOutlier.length-1;i>=0;i--){
  if(sansOutlier[i]<1.35) consecutifPetits++; else break;
 }
 let rouges=sansOutlier.slice(-5).filter(x=>x<1.35).length;

 let attendu;
 if(consecutifPetits>=5){
  attendu=5.5 + avg*0.5; // 5 petits -> 8.12x possible
 }else if(consecutifPetits>=3){
  attendu=2.0 + avg*0.3;
 }else if(last>3 && last2>3){
  attendu=1.35 + avg*0.1;
 }else if(last>last2 && last2>last3 && last>1.8){
  attendu=last+0.4;
 }else{
  attendu=(last*0.4+last2*0.3+avg*0.3)+0.15;
 }
 attendu=Math.max(1.10,Math.min(9,attendu));

 // TA TABLE
 let safe;
 if(attendu < 1.75) safe=1.00;
 else if(attendu < 2.0) safe=1.10;
 else if(attendu < 2.5) safe=1.25;
 else if(attendu < 3.0) safe=1.50;
 else if(attendu < 4.0) safe=2.00;
 else if(attendu < 6.0) safe=2.80;
 else safe=3.50;

 safe=Math.round(safe*100)/100; attendu=Math.round(attendu*100)/100;

 document.getElementById('prediction').textContent=safe.toFixed(2)+'x';
 document.getElementById('badge').textContent=`SAFE ${safe}x | VRAI ATTENDU ${attendu}x | AVG SANS OUTLIER ${avg.toFixed(2)}x`;
 document.getElementById('expli').innerHTML=
  `🧠 ${consecutifPetits} petits <1.35 d'affilée | ${rouges}/5 rouges | Outliers >10x ignorés (${historique.length-sansOutlier.length})<br>`+
  `📊 Vrai attendu: <b>${attendu}x</b> (avg sans outlier ${avg.toFixed(2)}x)<br>`+
  `🛡️ Safe: <b>${safe}x</b> selon règle ${attendu<1.75?'<1.75→1.00':attendu>=2.5&&attendu<3?'2.5→1.50':attendu>=8?'8.12→3.50':attendu+'→'+safe}`;
 document.getElementById('bar').innerHTML=
  `Attendu: ${attendu}x | Safe: ${safe}x | Petits: ${consecutifPetits} | Avg sans outlier: ${avg.toFixed(2)}x | Histo complet: ${historique.length} (dont ${historique.filter(x=>x>=10).length} outliers >10x ignorés)`;
}
renderHisto();
</script>
</body>
</html>
